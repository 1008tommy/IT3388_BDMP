command: ["streamlit", "run", "app.py"]

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  - name: REVIEW_TABLE
    valueFrom: table

  - name: METADATA_TABLE
    valueFrom: table-2

  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
  
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment

  - name: MLFLOW_TRACKING_URI
    value: "databricks"
